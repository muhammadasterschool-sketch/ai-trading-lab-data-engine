# build-admin-apk.yml — reproducible Android ADMIN PANEL APK build
# (v1.0.0, owner mandate).
#
# Builds the Flutter admin panel client (admin/) into a release APK
# signed with the DEBUG keystore (release signing is documented for
# later: admin/README-APK.md §Release signing). Uploads the artifact
# and attaches it (plus SHA256SUMS) to a GitHub Release tagged
# admin-apk-<sha12> (separate tag prefix from the monitoring APK so
# the two never collide).
#
# No secrets are required: the app embeds NOTHING (the owner
# configures their own engine URL + token + identity at first run).
# Only the repository's built-in GITHUB_TOKEN is used.
#
# Trigger: manual (workflow_dispatch) or changes under admin/.

name: build-admin-apk

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the APK to (e.g. v1.0.0-admin-apk)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: write

jobs:
  build-admin-apk:
    name: Flutter Admin APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Regenerate Android platform scaffolding
        # Same discipline as mobile/: generated android/ files are NOT
        # committed; flutter create regenerates them deterministically
        # around the committed lib/ + pubspec.yaml.
        working-directory: admin
        run: |
          flutter create . \
            --platforms android \
            --org com.aitradinglab \
            --project-name ai_trading_lab_admin \
            --description "AI Trading Lab admin panel (owner console, paper-only engine)"

      - name: "Patch Android manifest (network permission)"
        working-directory: admin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest_path.read_text(encoding="utf-8")
          for permission in ("android.permission.INTERNET",):
              marker = f'android:name="{permission}"'
              if marker in text:
                  print(f"already present: {permission}")
                  continue
              tag = f'    <uses-permission android:name="{permission}" />'
              idx = text.index(">", text.index("<manifest")) + 1
              text = text[:idx] + "\n" + tag + text[idx:]
              print(f"added: {permission}")
          manifest_path.write_text(text, encoding="utf-8")
          PY

      - name: Pub get
        working-directory: admin
        run: flutter pub get

      - name: Static analysis
        working-directory: admin
        run: flutter analyze --no-fatal-infos

      - name: Widget tests (if present)
        working-directory: admin
        run: |
          if ls test/*.dart >/dev/null 2>&1; then
            flutter test
          else
            echo "no widget tests present (static analysis only)"
          fi

      - name: Build release APK (debug-keystore signing)
        working-directory: admin
        run: flutter build apk --release

      - name: Collect + checksum
        run: |
          mkdir -p artifact
          cp admin/build/app/outputs/flutter-apk/app-release.apk \
             artifact/ai-trading-lab-admin.apk
          cd artifact
          sha256sum ai-trading-lab-admin.apk > SHA256SUMS.admin-apk.txt
          cat SHA256SUMS.admin-apk.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ai-trading-lab-admin-apk
          path: artifact/

      - name: Attach to GitHub Release (GITHUB_TOKEN only)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-admin-apk-${GITHUB_SHA::12}}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Android admin panel APK ($TAG)" \
              --notes "Reproducible Flutter build of the ADMIN PANEL client
          (commit $GITHUB_SHA, built $DATE).

          - Debug-keystore signed (release signing documented in
            admin/README-APK.md for later).
          - The APK contains ZERO secrets and NO default server address —
            the owner configures their OWN engine URL + token + identity
            at first run (secure storage only).
          - Surfaces: /api/users (who is logged in), /api/registrations
            (registration ledger), /api/ledger/* (trade ledger), and the
            STOP control (durable kill switch; resume is PC-gated).
          - LIVE TRADING IS NOT AUTHORIZED; PAPER_READY stays FALSE."
          gh release upload "$TAG" \
            artifact/ai-trading-lab-admin.apk \
            artifact/SHA256SUMS.admin-apk.txt --clobber
          echo "release: $TAG"
