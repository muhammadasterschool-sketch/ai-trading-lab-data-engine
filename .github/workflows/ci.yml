name: ci
on:
  workflow_dispatch:
  schedule:
    # Reconstruction D-7 (2026-10-17): weekly scheduled run
    # (Mondays 03:17 UTC). The scheduled event runs the SAME jobs
    # (tests + validator + dependency audit). F-16 (2026-10-19):
    # the dependency audit now ALSO runs on pull_request AND push
    # events — direct pushes to protected branches no longer skip
    # vulnerability auditing.
    - cron: "17 3 * * 1"
  push:
    branches: [main, "phase-4a/**"]
  pull_request:
    branches: [main]

# SECURITY: never pull_request_target; never expose secrets; repo
# verification stack is secret-free by design.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # F-15 (2026-10-19): 3.13 + the DECLARED runtime 3.14
        # (.python-version) join the matrix — the declared runtime
        # was previously never CI-tested.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs of verified upstream
      # tags (reconstruction D-7/hardening): immutable references, no
      # tag-renaming drift.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0   # frozen-blob comparison needs history
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
      - name: Full test suite (must be 100% green)
        run: uv run pytest -q -p no:cacheprovider
      - name: Deployment-template validator (fail-closed — reconstruction D-3)
        run: uv run python scripts/validate_deployment_templates.py
      - name: Determinism (three consecutive runs)
        run: |
          uv run pytest -q -p no:cacheprovider
          uv run pytest -q -p no:cacheprovider
      - name: Frozen Phase 3 verification (11/11 blobs + SUB-18 13/13)
        run: |
          uv run python - <<'PY'
          import hashlib, subprocess, sys
          from pathlib import Path
          # committed reference: blobs must be byte-identical to
          # main@13fdc7e (see tests/test_pit_view.py SUB-18 manifest)
          FROZEN = [
              "src/data_engine/strategy/__init__.py",
              "src/data_engine/strategy/backtest.py",
              "src/data_engine/strategy/conditions.py",
              "src/data_engine/strategy/equity.py",
              "src/data_engine/strategy/execution.py",
              "src/data_engine/strategy/ledger.py",
              "src/data_engine/strategy/metrics.py",
              "src/data_engine/strategy/position.py",
              "src/data_engine/strategy/provenance.py",
              "src/data_engine/strategy/schemas.py",
              "src/data_engine/strategy/validation.py",
          ]
          base = subprocess.run(
              ["git", "show", "13fdc7e:src/data_engine/strategy/"
               + Path(FROZEN[0]).name],
              capture_output=True, text=True, check=True,
          )
          ok = True
          for f in FROZEN:
              current = Path(f).read_bytes()
              ref = subprocess.run(
                  ["git", "show", f"13fdc7e:{f}"],
                  capture_output=True, check=True,
              ).stdout
              if hashlib.sha256(current).hexdigest() != \
                      hashlib.sha256(ref).hexdigest():
                  print(f"FROZEN VIOLATION: {f}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
      - name: Secret scan (0 hits required)
        run: |
          # F-18 (2026-10-19): extended credential family coverage —
          # PEM/OPENSSH/EC private-key headers, Slack tokens (xox*)
          # and Google API keys (AIza) join the original 4 prefixes.
          #
          # F-18b (2026-10-19): DOCUMENTED false-positive baseline.
          # Commits a2a6d2b / ddb4a2b (Stage F, parallel delivery)
          # carry a KNOWN SYNTHETIC github_pat fixture inside
          # tests/test_monitoring_api.py (github_pat_11AAAAxxx...,
          # conspicuously fake). The 0-secret gate is pattern-based
          # and rightly refuses fakes too, so the PERMANENT
          # historical blob is baselined by its exact synthetic
          # marker: any hit NOT carrying the marker still fails the
          # gate. History rewrite is FORBIDDEN (owner hard rule), so
          # baseline-not-rewrite is the only compliant remediation.
          # From the fix commit onward the current tree assembles
          # the fixture from pieces (no literal at all).
          PATTERN="github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----"
          BASELINE="github_pat_11AAAA"
          set +e
          raw=$(git grep -nE "$PATTERN" $(git rev-list --all))
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "SECRET SCAN: git grep itself failed (exit $status) — fail closed"
            exit 1
          fi
          hits=$(printf '%s\n' "$raw" | { grep -vF "$BASELINE" || true; })
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "SECRET SCAN FAILED: non-baselined credential-shaped hits above"
            exit 1
          fi
          echo "SECRET SCAN: 0 hits beyond the documented synthetic baseline"
      - name: Prediction acceptance tests (T-PRED + red-team matrix)
        run: uv run pytest tests/test_prediction_redteam_matrix.py -q

  # F-15 (2026-10-19): lint + SAST + coverage evidence gates.
  # Evidence-first posture per the patch plan ("ruff lint-only,
  # non-blocking → blocking on new code paths"): the tools run on
  # every push/PR with PINNED versions, reports are RETAINED as
  # artifacts, and findings are recorded without failing this job
  # YET (the legacy codebase carries lint debt; flipping these to
  # blocking is a tracked follow-up gated on a clean baseline).
  # Tooling is ephemeral (pinned pip installs), NOT added to the
  # frozen lockfile — uv.lock stays byte-identical (frozen-blob
  # discipline preserved).
  lint-sast-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
      - name: Lint evidence (ruff, pinned, non-blocking record)
        run: |
          pip install ruff==0.12.3
          ruff check src tests scripts > ruff-report.txt 2>&1 || true
          ruff check --statistics src tests scripts >> ruff-report.txt 2>&1 || true
          head -50 ruff-report.txt
      - name: SAST evidence (bandit, pinned, non-blocking record)
        run: |
          pip install bandit==1.8.6
          bandit -r src -f json -o bandit-report.json --quiet || true
          bandit -r src -f screen --quiet || true
      - name: Coverage evidence (pytest-cov, pinned, artifact retained)
        run: |
          pip install pytest-cov==6.1.1
          uv run --with pytest-cov==6.1.1 pytest tests/ -q -p no:cacheprovider \
            --cov=src/data_engine --cov-report=xml:coverage.xml \
            --cov-report=term | tail -30
      - name: Retain lint/SAST/coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-sast-coverage-evidence
          path: |
            ruff-report.txt
            bandit-report.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 30

  # Reconstruction D-7 (2026-10-17): dependency-audit hardening on top
  # of the Batch 17 opt-in job. Triggers: workflow_dispatch, weekly
  # schedule, pull_request AND (F-16, 2026-10-19) push events.
  # Evidence handling is fail-closed:
  #   * the audit tool is version-pinned (pip-audit==2.10.1);
  #   * the locked-set export AND the machine-readable audit JSON are
  #     RETAINED as workflow artifacts (the previous job deleted its
  #     only evidence);
  #   * the uv.lock digest is recorded so results bind to exact
  #     dependency inputs;
  #   * a missing/invalid audit report is INCONCLUSIVE and FAILS the
  #     job — a tool outage can never masquerade as a clean audit.
  audit-dependencies:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
      - name: Record dependency inputs (lockfile digest + locked export)
        run: |
          sha256sum uv.lock | tee dependency-audit-lock-digest.txt
          # Export ALL locked pins (runtime + dev) — auditing dev deps
          # too is the conservative, fail-closed posture.
          uv export --frozen --no-header --no-emit-project --extra dev -o requirements-audit.txt
          sha256sum requirements-audit.txt | tee -a dependency-audit-lock-digest.txt
      - name: Dependency vulnerability audit (pip-audit over the lock)
        run: |
          pip install pip-audit==2.10.1
          # --strict: fail on ANY known vulnerability (fail closed).
          # --disable-pip: audit the exported locked pins only, not the
          # ambient pip tooling itself. Machine-readable JSON report is
          # written next to the locked export for retention.
          pip-audit --strict --disable-pip \
            -r requirements-audit.txt \
            --format json --output dependency-audit.json
      - name: Audit evidence verification (clean != incomplete)
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path
          report = Path("dependency-audit.json")
          if not report.is_file():
              print("INCONCLUSIVE: dependency-audit.json is missing — "
                    "audit evidence absent; this is NOT a clean audit")
              sys.exit(1)
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              print(f"INCONCLUSIVE: audit report is not valid JSON ({exc})")
              sys.exit(1)
          deps = data.get("dependencies", [])
          print(f"audit evidence OK — {len(deps)} audited dependency "
                "entries recorded")
          print("verdict: the audit RAN to completion; vulnerability "
                "verdicts live in the retained JSON (pip-audit --strict "
                "already failed this job on any known vulnerability)")
          PY
      - name: Retain audit evidence as workflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-evidence
          path: |
            dependency-audit.json
            requirements-audit.txt
            dependency-audit-lock-digest.txt
          if-no-files-found: error
          retention-days: 30
