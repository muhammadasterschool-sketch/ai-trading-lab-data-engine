name: ci
on:
  workflow_dispatch:
  schedule:
    # Reconstruction D-7 (2026-10-17): weekly scheduled run
    # (Mondays 03:17 UTC). The scheduled event runs the SAME jobs
    # (tests + validator + dependency audit) — informational; it never
    # blocks pull requests, and the PR-trigger policy below is
    # unchanged.
    - cron: "17 3 * * 1"
  push:
    branches: [main, "phase-4a/**"]
  pull_request:
    branches: [main]

# SECURITY: never pull_request_target; never expose secrets; repo
# verification stack is secret-free by design.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs of verified upstream
      # tags (reconstruction D-7/hardening): immutable references, no
      # tag-renaming drift.
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          fetch-depth: 0   # frozen-blob comparison needs history
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
      - name: Full test suite (must be 100% green)
        run: uv run pytest -q -p no:cacheprovider
      - name: Deployment-template validator (fail-closed — reconstruction D-3)
        run: uv run python scripts/validate_deployment_templates.py
      - name: Determinism (three consecutive runs)
        run: |
          uv run pytest -q -p no:cacheprovider
          uv run pytest -q -p no:cacheprovider
      - name: Frozen Phase 3 verification (11/11 blobs + SUB-18 13/13)
        run: |
          uv run python - <<'PY'
          import hashlib, subprocess, sys
          from pathlib import Path
          # committed reference: blobs must be byte-identical to
          # main@13fdc7e (see tests/test_pit_view.py SUB-18 manifest)
          FROZEN = [
              "src/data_engine/strategy/__init__.py",
              "src/data_engine/strategy/backtest.py",
              "src/data_engine/strategy/conditions.py",
              "src/data_engine/strategy/equity.py",
              "src/data_engine/strategy/execution.py",
              "src/data_engine/strategy/ledger.py",
              "src/data_engine/strategy/metrics.py",
              "src/data_engine/strategy/position.py",
              "src/data_engine/strategy/provenance.py",
              "src/data_engine/strategy/schemas.py",
              "src/data_engine/strategy/validation.py",
          ]
          base = subprocess.run(
              ["git", "show", "13fdc7e:src/data_engine/strategy/"
               + Path(FROZEN[0]).name],
              capture_output=True, text=True, check=True,
          )
          ok = True
          for f in FROZEN:
              current = Path(f).read_bytes()
              ref = subprocess.run(
                  ["git", "show", f"13fdc7e:{f}"],
                  capture_output=True, check=True,
              ).stdout
              if hashlib.sha256(current).hexdigest() != \
                      hashlib.sha256(ref).hexdigest():
                  print(f"FROZEN VIOLATION: {f}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY
      - name: Secret scan (0 hits required)
        run: |
          ! git grep -nE "github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}" $(git rev-list --all)
      - name: Prediction acceptance tests (T-PRED + red-team matrix)
        run: uv run pytest tests/test_prediction_redteam_matrix.py -q

  # Reconstruction D-7 (2026-10-17): dependency-audit hardening on top
  # of the Batch 17 opt-in job. Triggers: workflow_dispatch + the
  # weekly schedule — still NEVER on push/PR, so the pull-request
  # blocking policy is UNCHANGED (this job stays informational; making
  # it PR-blocking is a separate explicit operator decision in EITHER
  # direction). Evidence handling is now fail-closed:
  #   * the audit tool is version-pinned (pip-audit==2.10.1);
  #   * the locked-set export AND the machine-readable audit JSON are
  #     RETAINED as workflow artifacts (the previous job deleted its
  #     only evidence);
  #   * the uv.lock digest is recorded so results bind to exact
  #     dependency inputs;
  #   * a missing/invalid audit report is INCONCLUSIVE and FAILS the
  #     job — a tool outage can never masquerade as a clean audit.
  audit-dependencies:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --extra dev
      - name: Record dependency inputs (lockfile digest + locked export)
        run: |
          sha256sum uv.lock | tee dependency-audit-lock-digest.txt
          # Export ALL locked pins (runtime + dev) — auditing dev deps
          # too is the conservative, fail-closed posture.
          uv export --frozen --no-header --no-emit-project --extra dev -o requirements-audit.txt
          sha256sum requirements-audit.txt | tee -a dependency-audit-lock-digest.txt
      - name: Dependency vulnerability audit (pip-audit over the lock)
        run: |
          pip install pip-audit==2.10.1
          # --strict: fail on ANY known vulnerability (fail closed).
          # --disable-pip: audit the exported locked pins only, not the
          # ambient pip tooling itself. Machine-readable JSON report is
          # written next to the locked export for retention.
          pip-audit --strict --disable-pip \
            -r requirements-audit.txt \
            --format json --output dependency-audit.json
      - name: Audit evidence verification (clean != incomplete)
        run: |
          uv run python - <<'PY'
          import json, sys
          from pathlib import Path
          report = Path("dependency-audit.json")
          if not report.is_file():
              print("INCONCLUSIVE: dependency-audit.json is missing — "
                    "audit evidence absent; this is NOT a clean audit")
              sys.exit(1)
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              print(f"INCONCLUSIVE: audit report is not valid JSON ({exc})")
              sys.exit(1)
          deps = data.get("dependencies", [])
          print(f"audit evidence OK — {len(deps)} audited dependency "
                "entries recorded")
          print("verdict: the audit RAN to completion; vulnerability "
                "verdicts live in the retained JSON (pip-audit --strict "
                "already failed this job on any known vulnerability)")
          PY
      - name: Retain audit evidence as workflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-evidence
          path: |
            dependency-audit.json
            requirements-audit.txt
            dependency-audit-lock-digest.txt
          if-no-files-found: error
          retention-days: 30
