name: ai_trading_lab_admin
description: >
  AI Trading Lab — Android ADMIN PANEL (v1.0.0, owner mandate).
  The owner's console for their OWN ai-trading-lab-data-engine
  deployment: WHO is logged in (names + emails, self-reported),
  the registration ledger, the trade ledger ("kis pe trade li,
  kitna profit hua") and the STOP control. ZERO secrets are
  embedded: the connection (server URL + token + admin identity)
  is user-configured at first run and stored in Android
  Keystore-backed secure storage only.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # token storage in Android Keystore-backed secure storage — never
  # shared preferences, never plain files
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
