plugins {
    id 'com.android.application'
}

// v3.0.2 SECRET HYGIENE: signing credentials are NOT stored in this file and the
// keystore is NOT committed. They are read from android-app/keystore.properties
// (local-only, gitignored). If that file is absent, release builds are unsigned
// (assembleRelease still succeeds but the APK is unsigned — sign it manually with
// apksigner, or restore the local keystore.properties). Debug builds are unaffected.
// Owner action recommended: generate a NEW keystore, because the old keystore and
// its passwords were historically committed to the public repository.
// v3.1.0: Binance SPOT read-only market data + broker registry + Markets dashboard (v3.0.3 P1 gates intact),
// request-size cap. Version identity stays single-sourced from defaultConfig.
def ksProps = new Properties()
def ksPropsFile = rootProject.file("keystore.properties")
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.aitradinglab.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.aitradinglab.monitor"
        minSdk 24
        targetSdk 34
        versionCode 33
        versionName "3.1.0"
    }

    signingConfigs {
        if (ksPropsFile.exists()) {
            release {
                storeFile file(ksProps["storeFile"])
                storePassword ksProps["storePassword"]
                keyAlias ksProps["keyAlias"]
                keyPassword ksProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksPropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Runtime: zero external dependencies — pure platform widgets (fastest, most reliable build)
// Test scope only (v3.0.2): JUnit for the P0 loopback-binding regression test. Not packaged in the APK.
// Test scope only (v3.1): org.json real implementation for the BinanceMarketData host tests
// (Android ships org.json in the platform; the Maven artifact is the same API lineage and
// keeps the pure-Java Binance module testable on the host JVM). Not packaged in the APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
