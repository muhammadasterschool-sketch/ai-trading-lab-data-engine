plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aitradinglab.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.aitradinglab.monitor"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "3.0.1"
    }

    signingConfigs {
        release {
            storeFile file("../ai-trading-lab.keystore")
            storePassword "atl-v4-release"
            keyAlias "atl"
            keyPassword "atl-v4-release"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Runtime: zero external dependencies — pure platform widgets (fastest, most reliable build)
// Test scope only (v3.0.2): JUnit for the P0 loopback-binding regression test. Not packaged in the APK.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
