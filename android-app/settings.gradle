pluginManagement {
    repositories {
        google()
        // Aliyun mirror of Maven Central — repo1.maven.org rate-limits this network (HTTP 429)
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}
rootProject.name = "AI Trading Lab"
include ':app'
