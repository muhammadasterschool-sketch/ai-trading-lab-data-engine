<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trading Lab — Connect</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b; color: #fafafa;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 28px; min-height: 100vh; user-select: none;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #fbbf24, #d97706);
    display: flex; align-items: center; justify-content: center; font-size: 34px; }
  h1 { margin-top: 16px; font-size: 21px; }
  .sub { color: #52525b; font-size: 12px; margin-top: 4px; }
  .badge { color: #f59e0b; border: 1px solid rgba(245,158,11,.3); background: rgba(245,158,11,.12);
    border-radius: 5px; padding: 1px 7px; font-size: 10px; font-weight: 700; margin-left: 6px; }
  .modes { display: flex; gap: 10px; width: 100%; margin-top: 26px; }
  .mode {
    flex: 1; background: #18181b; border: 1px solid #27272a; border-radius: 12px;
    padding: 16px 12px; text-align: center; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .mode .m-title { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: #52525b; }
  .mode .m-sub { font-size: 10px; color: #52525b; margin-top: 4px; }
  .mode:hover { border-color: #3f3f46; }
  .mode.sel-local { background: rgba(245,158,11,.10); border-color: #f59e0b; }
  .mode.sel-local .m-title { color: #fafafa; }
  .mode.sel-local .m-sub { color: #a1a1aa; }
  .mode.sel-cloud { background: rgba(96,165,250,.10); border-color: #60a5fa; }
  .mode.sel-cloud .m-title { color: #fafafa; }
  .mode.sel-cloud .m-sub { color: #a1a1aa; }
  .info { width: 100%; color: #a1a1aa; font-size: 12px; line-height: 1.55; margin-top: 14px; min-height: 38px; }
  .info b { color: #fafafa; }
  input { width: 100%; height: 46px; background: #18181b; border: 1px solid #27272a; border-radius: 9px;
    color: #fafafa; padding: 0 14px; font-size: 14px; margin-top: 10px; outline: none; user-select: text; }
  input:focus { border-color: #f59e0b; }
  button { width: 100%; height: 48px; border: none; border-radius: 9px; background: #f59e0b;
    color: #09090b; font-weight: 700; font-size: 14px; letter-spacing: .06em; cursor: pointer; margin-top: 14px; }
  button:active { background: #fbbf24; }
  button:disabled { opacity: .4; cursor: default; }
  .forget { background: transparent; color: #a1a1aa; font-weight: 400; height: 34px; font-size: 12px; display: none; }
  .err { color: #f87171; font-size: 12px; margin-top: 12px; line-height: 1.5; text-align: center; min-height: 0; }
  .last { color: #52525b; font-size: 11px; margin-top: 10px; display: none; }
  .foot { color: #52525b; font-size: 10px; margin-top: auto; padding-top: 24px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>AI Trading Lab</h1>
  <p class="sub">Data Engine <span class="badge">v4.0</span></p>

  <div class="modes">
    <div class="mode" id="modeLocal">
      <div class="m-title">LOCAL</div>
      <div class="m-sub">Same Wi-Fi / this PC</div>
    </div>
    <div class="mode" id="modeCloud">
      <div class="m-title">CLOUD</div>
      <div class="m-sub">From anywhere</div>
    </div>
  </div>

  <div class="info" id="info"></div>

  <input id="url" type="text" placeholder="Server address" spellcheck="false" />
  <div class="last" id="last"></div>
  <button id="connect" disabled>CONNECT</button>
  <button id="forget" class="forget">Forget this server</button>
  <div class="err" id="err"></div>

  <div class="foot">Invite-only · registration needs an invitation code<br>Every login requires 2FA · paper trading only</div>

<script>
  const { ipcRenderer } = require('electron')
  const input = document.getElementById('url')
  const btn = document.getElementById('connect')
  const forget = document.getElementById('forget')
  const err = document.getElementById('err')
  const info = document.getElementById('info')
  const last = document.getElementById('last')
  const mLocal = document.getElementById('modeLocal')
  const mCloud = document.getElementById('modeCloud')

  let mode = localStorage.getItem('atl_mode') || 'local'

  function applyMode() {
    mLocal.className = 'mode' + (mode === 'local' ? ' sel-local' : '')
    mCloud.className = 'mode' + (mode === 'cloud' ? ' sel-cloud' : '')
    if (mode === 'local') {
      info.innerHTML = 'This PC or the same Wi-Fi network.<br>Enter the computer address, e.g. <b>localhost:81</b> or <b>192.168.x.x:81</b>'
      input.placeholder = 'Computer address, e.g. 192.168.1.10:81'
    } else {
      info.innerHTML = 'Engine running on a cloud server (VPS).<br>Enter your server URL, e.g. <b>https://your-domain.com</b>'
      input.placeholder = 'Cloud URL, e.g. https://your-domain.com'
    }
    const saved = localStorage.getItem('atl_last_' + mode) || ''
    input.value = saved
    last.textContent = saved ? 'Last used: ' + saved : ''
    last.style.display = saved ? 'block' : 'none'
    forget.style.display = saved ? 'block' : 'none'
    localStorage.setItem('atl_mode', mode)
    validate()
  }

  mLocal.addEventListener('click', () => { mode = 'local'; err.textContent = ''; applyMode() })
  mCloud.addEventListener('click', () => { mode = 'cloud'; err.textContent = ''; applyMode() })

  function validate() {
    const v = input.value.trim()
    const ok = v.length > 4 && /^[A-Za-z0-9.:\-_/]+$/.test(v.replace(/^https?:\/\//i, ''))
    btn.disabled = !ok
  }
  input.addEventListener('input', () => { err.textContent = ''; validate() })
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !btn.disabled) btn.click() })
  btn.addEventListener('click', () => {
    localStorage.setItem('atl_last_' + mode, input.value.trim())
    ipcRenderer.send('connect', input.value)
  })
  forget.addEventListener('click', () => {
    localStorage.removeItem('atl_last_' + mode)
    input.value = ''
    last.style.display = 'none'
    forget.style.display = 'none'
    validate()
  })

  ipcRenderer.on('prefill', (_e, d) => {
    if (d.url && !localStorage.getItem('atl_mode')) {
      mode = /:81\b/.test(d.url) || /^http:\/\/\d/.test(d.url) ? 'local' : 'cloud'
    }
    applyMode()
    err.textContent = d.error || ''
    validate()
    if (!input.value) input.focus()
  })
  ipcRenderer.on('connect-error', (_e, msg) => { err.textContent = msg })
</script>
</body>
</html>
